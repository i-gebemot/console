property-templates:
  - &attr
    font: Excalidraw
    daisy: 'bg-gray-300'

  - &attr-course
    <<: *attr
    daisy: 'bg-cyan-200'

  - &attr-topic
    <<: *attr
    daisy: 'bg-lime-200'

  - &attr-date
    <<: *attr
    daisy: 'bg-orange-400'

  - &attr-time
    <<: *attr
    daisy: 'bg-yellow-400'

  - &attr-ages
    <<: *attr
    daisy: 'bg-gray-300'


