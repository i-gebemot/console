property-templates:
  - &attr
    daisy: ''

  - &attr-course
    <<: *attr
    tailwind: 'text-2xl bg-cyan-200'

  - &attr-topic
    <<: *attr
    tailwind: 'text-2xl bg-lime-200'

  - &attr-date
    <<: *attr
    tailwind: 'text-2xl bg-orange-400'

  - &attr-time
    <<: *attr
    tailwind: 'text-2xl bg-yellow-400'

  - &attr-tags
    <<: *attr
    tailwinds: 
      - 'text-md bg-red-200'

  - &attr-counter
    <<: *attr
    tailwind: 'text-md bg-gray-100'

