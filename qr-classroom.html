<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code Generator</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #222;
      --data: #001eff;
      --paper: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Comic Sans MS", "Comic Neue", "Marker Felt", "Segoe Print", cursive;
      font-size: 20px;
      line-height: 1.1;
    }

    main {
      width: min(100vw, 520px);
      min-height: 100vh;
      padding: 12px 10px 14px;
    }

    label {
      display: block;
      margin: 0 0 3px 12px;
      font-size: 21px;
      letter-spacing: 0;
    }

    input {
      display: block;
      width: 100%;
      height: 38px;
      border: 3px solid var(--ink);
      border-radius: 9px;
      background: #fff;
      color: var(--data);
      font: inherit;
      font-size: 19px;
      line-height: 1;
      padding: 4px 13px 6px;
      outline: none;
      box-shadow: none;
    }

    input:focus {
      border-color: #000;
      box-shadow: 0 0 0 2px rgba(0, 30, 255, 0.16);
    }

    .field {
      width: 160px;
    }

    .url-field {
      width: 400px;
      margin: 10px 0 0 11px;
    }

    .qr-wrap {
      width: 100%;
      aspect-ratio: 1;
      margin: 8px auto 28px;
      display: grid;
      place-items: center;
    }

    #qrcode {
      width: 100%;
      height: 100%;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      image-rendering: pixelated;
    }

    .qr-error {
      width: 100%;
      min-height: 100%;
      border: 3px solid var(--ink);
      display: grid;
      place-items: center;
      padding: 12px;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.15;
      text-align: center;
    }

    #encoded-url {
      display: none;
      margin: 0;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.24;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-family: "Comic Sans MS", "Comic Neue", "Marker Felt", "Segoe Print", cursive;
    }

    @media (max-width: 420px) {
      main {
        width: 100%;
        padding-right: 14px;
      }

      .url-field {
        width: min(332px, calc(100vw - 32px));
      }

      .field {
        width: 100%;
      }

    }
  </style>
</head>
<body>
  <main aria-label="QR code URL generator">
    <section class="url-field">
      <input id="classroom" value="6-12" spellcheck="false">
    </section>

    <pre id="encoded-url"></pre>

    <div class="qr-wrap" aria-live="polite">
      <div id="qrcode" aria-label="Generated QR code"></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const fields = {
      classroom: document.getElementById("classroom"),
    };

    const qrTarget = document.getElementById("qrcode");
    const encodedUrl = document.getElementById("encoded-url");
    let qrCode;

    function buildEncodedUrl() {
      let baseurl = "gebemot.online";
      const classroom = fields.classroom.value.trim() || "112233";
      const url = `${baseurl}/${classroom}`;
      return url;
    }

    function update() {
      let value;

      try {
        value = buildEncodedUrl();
        console.log(value);
      } catch {
        encodedUrl.textContent = "Enter a valid URL.";
        qrTarget.replaceChildren();
        qrCode = undefined;
        return;
      }

      encodedUrl.textContent = value;

      if (typeof QRCode === "undefined") {
        qrTarget.innerHTML = '<div class="qr-error">QR library could not load.</div>';
        return;
      }

      if (!qrCode) {
        qrCode = new QRCode(qrTarget, {
          text: value,
          width: 180,
          height: 180,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
        return;
      }

      qrCode.clear();
      qrCode.makeCode(value);
    }

    Object.values(fields).forEach((field) => {
      field.addEventListener("input", update);
      field.addEventListener("change", update);
    });

    update();
  </script>
</body>
</html>
